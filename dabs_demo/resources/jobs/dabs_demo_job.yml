resources:
  jobs:
    demo_job:
      name: demo_job
      tasks:
        - task_key: demo_notebook
          notebook_task:
            notebook_path: ../notebooks/demo_repo_notebook.py
            source: WORKSPACE
          job_cluster_key: demo_notebook_cluster
      job_clusters:
        - job_cluster_key: demo_notebook_cluster
          new_cluster:
            spark_version: 17.3.x-scala2.13
            node_type_id: Standard_DC4as_v5
            data_security_mode: DATA_SECURITY_MODE_AUTO
            runtime_engine: STANDARD
            kind: CLASSIC_PREVIEW
            is_single_node: true
      queue:
        enabled: true
